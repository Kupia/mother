<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Твое большое морское путешествие — С днём рождения, Татьяна!</title>
  <meta name="description" content="Карта морей, озёр и побережий с фотографиями — поздравление Татьяны с днём рождения.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <div class="wave-layer" id="waveLayer" aria-hidden="true">
    <div class="wave-layer__wave wave-layer__wave--back"></div>
    <div class="wave-layer__wave wave-layer__wave--front"></div>
  </div>
  <div class="crab-layer" id="crabLayer" aria-hidden="true"></div>

  <header class="topbar">
    <div>
      <p class="topbar__eyebrow">26 · 11 · твой день</p>
      <h1>Твое большое морское путешествие</h1>
    </div>
    <div class="topbar__actions">
      <button class="topbar__wave" id="greetWave" type="button">Поздравляем 🌊</button>
      <button class="topbar__celebrate" id="celebrate" type="button">Поздравить 🎉</button>
    </div>
  </header>

  <main class="map" id="map">
    <svg class="map__canvas" viewBox="0 0 1000 3600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <symbol id="foot" viewBox="0 0 24 36">
          <path d="M12 10 C8 10 6 14 6.5 20 C7 26 6 31 8 34 C10 36.5 14 36.5 16 34 C18 31 17 26 17.5 20 C18 14 16 10 12 10 Z"></path>
          <circle cx="6.6" cy="7" r="1.5"></circle>
          <circle cx="9" cy="4.8" r="1.6"></circle>
          <circle cx="12" cy="4" r="1.7"></circle>
          <circle cx="15" cy="4.8" r="1.6"></circle>
          <circle cx="17.4" cy="7" r="1.5"></circle>
        </symbol>
        <symbol id="crab" viewBox="0 0 40 28">
          <g fill="none" stroke="#b06f77" stroke-width="2" stroke-linecap="round">
            <path d="M11 16 L6 19 M11 13 L5 13 M11 10 L7 7 M29 16 L34 19 M29 13 L35 13 M29 10 L33 7"></path>
            <path d="M15.5 9 L15.5 7.5 M24.5 9 L24.5 7.5" stroke-width="1"></path>
          </g>
          <circle cx="5" cy="19" r="2.6" fill="#c9878e"></circle>
          <circle cx="35" cy="19" r="2.6" fill="#c9878e"></circle>
          <ellipse cx="20" cy="15" rx="10.5" ry="7" fill="#c9878e"></ellipse>
          <ellipse cx="16.5" cy="12" rx="4" ry="2" fill="#f6e2c8" opacity="0.55"></ellipse>
          <circle cx="15.5" cy="7" r="2.3" fill="#fffdfb"></circle>
          <circle cx="24.5" cy="7" r="2.3" fill="#fffdfb"></circle>
          <circle cx="15.5" cy="7" r="1" fill="#3d302b"></circle>
          <circle cx="24.5" cy="7" r="1" fill="#3d302b"></circle>
          <path d="M17 18 Q20 20.5 23 18" fill="none" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" opacity="0.8"></path>
        </symbol>
        <symbol id="jellyfish" viewBox="0 0 60 96">
          <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
            <path d="M8 42 C8 20 18 8 30 8 C42 8 52 20 52 42 C44 48 37 43 30 45 C23 43 16 48 8 42 Z" fill="#ffffff" fill-opacity="0.22"></path>
            <path d="M18 46 C15 60 22 68 18 82"></path>
            <path d="M30 46 C27 62 34 70 30 90"></path>
            <path d="M42 46 C45 60 38 68 42 82"></path>
          </g>
        </symbol>
        <symbol id="icon-lighthouse" viewBox="0 0 48 64">
          <path d="M24 0 L21 5 L27 5 Z" fill="currentColor"></path>
          <path d="M14 12 L34 12 L31 6 L17 6 Z" fill="currentColor"></path>
          <path d="M18 14 L30 14 L29 20 L19 20 Z" fill="currentColor"></path>
          <path d="M16 58 L20 20 L28 20 L32 58 Z" fill="currentColor"></path>
          <path d="M18 33 L30 33 L30 39 L18 39 Z" fill="#f2ddb8"></path>
          <circle cx="24" cy="26" r="2.2" fill="#f2ddb8"></circle>
          <path d="M12 58 L36 58 L36 62 L12 62 Z" fill="currentColor"></path>
        </symbol>
        <symbol id="icon-boat" viewBox="0 0 64 56">
          <!-- Яхта: теперь на Кипре -->
          <path d="M32 5 L32 36 L48 36 Z" fill="currentColor"></path>
          <path d="M28 12 L28 36 L14 36 Z" fill="currentColor"></path>
          <path d="M6 39 L58 39 L49 51 L15 51 Z" fill="currentColor"></path>
          <path d="M10 54 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
        </symbol>
        <symbol id="icon-bicycle" viewBox="0 0 72 64">
          <!-- Велосипед для Минского моря -->
          <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="19" cy="46" r="13"></circle>
            <circle cx="53" cy="46" r="13"></circle>
            <path d="M19 46 L31 24 L36 46 Z"></path>
            <path d="M31 24 L47 24 L53 46"></path>
            <path d="M47 24 L50 16 L57 16"></path>
            <path d="M27 21 L34 21"></path>
          </g>
          <circle cx="36" cy="46" r="3" fill="currentColor"></circle>
        </symbol>
        <symbol id="icon-lakes" viewBox="0 0 64 48">
          <!-- Три озера, залиты цветом морской воды на этой глубине -->
          <ellipse cx="17" cy="29" rx="12" ry="7" fill="#6db0d5"></ellipse>
          <ellipse cx="45" cy="23" rx="10" ry="6" fill="#6db0d5"></ellipse>
          <ellipse cx="43" cy="40" rx="9" ry="5" fill="#6db0d5"></ellipse>
        </symbol>
        <symbol id="icon-bridge" viewBox="0 0 80 48">
          <!-- Вантовый мост: прямой настил, две опоры и веер прямых тросов -->
          <path d="M4 38 L76 38 L76 43 L4 43 Z" fill="currentColor"></path>
          <path d="M21 5 L26 5 L26 38 L21 38 Z" fill="currentColor"></path>
          <path d="M54 5 L59 5 L59 38 L54 38 Z" fill="currentColor"></path>
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M23.5 10 L6 38 M23.5 10 L14 38 M23.5 10 L34 38 M23.5 10 L41 38"></path>
            <path d="M56.5 10 L39 38 M56.5 10 L46 38 M56.5 10 L66 38 M56.5 10 L74 38"></path>
          </g>
        </symbol>
        <symbol id="icon-buddha" viewBox="0 0 64 64">
          <circle cx="32" cy="16" r="9" fill="currentColor"></circle>
          <circle cx="32" cy="6" r="3.4" fill="currentColor"></circle>
          <path d="M27 25 L37 25 L42 45 L22 45 Z" fill="currentColor"></path>
          <path d="M32 27 C23 28 18 35 16 46 L24 46 C26 38 29 35 32 35 C35 35 38 38 40 46 L48 46 C46 35 41 28 32 27 Z" fill="currentColor"></path>
          <path d="M12 52 C18 45 26 47 32 51 C38 47 46 45 52 52 C47 59 38 60 32 56 C26 60 17 59 12 52 Z" fill="currentColor"></path>
        </symbol>
      </defs>
      <!-- По одному островку под каждую точку маршрута, у каждого свой берег -->
      <g class="map__islands">
        <path d="M330,60 C390,70 430,150 420,230 C410,310 440,390 400,470 C370,530 320,560 285,520 C250,480 265,400 255,330 C245,250 270,170 285,110 C295,75 310,55 330,60 Z"></path>
        <path d="M540,820 C580,760 680,740 770,770 C840,790 900,840 930,900 C900,930 850,920 820,950 C790,980 800,1040 740,1060 C670,1080 580,1050 545,990 C520,950 515,870 540,820 Z"></path>
        <path d="M180,1320 C260,1280 360,1300 420,1380 C450,1420 420,1460 390,1480 C410,1530 380,1600 320,1650 C250,1700 170,1680 130,1610 C90,1540 110,1400 180,1320 Z"></path>
        <path d="M645,1893 Q700,1855 752,1896 Q804,1936 874,1962 Q945,1987 921,2044 Q898,2101 880,2164 Q861,2227 781,2209 Q700,2190 628,2199 Q556,2208 532,2154 Q509,2099 470,2040 Q432,1981 511,1955 Q591,1930 645,1893 Z"></path>
        <path d="M180,2530 C250,2470 360,2470 420,2540 C470,2600 460,2670 430,2710 C460,2760 430,2840 360,2870 C280,2900 180,2870 130,2800 C90,2740 110,2590 180,2530 Z"></path>
        <path d="M612,3089 Q690,3087 771,3086 Q851,3085 859,3157 Q867,3230 902,3290 Q937,3350 871,3385 Q805,3419 748,3474 Q690,3529 638,3467 Q586,3405 519,3377 Q452,3348 471,3285 Q490,3223 512,3158 Q534,3092 612,3089 Z"></path>
      </g>
      <g class="map__jellyfish" aria-hidden="true">
        <use href="#jellyfish" x="470" y="1760" width="72" height="115"></use>
        <use href="#jellyfish" x="560" y="2960" width="56" height="90"></use>
      </g>
      <g class="map__icons" aria-hidden="true">
        <use href="#icon-lighthouse" x="250" y="140" width="60" height="80"></use>
        <use href="#icon-bicycle" x="760" y="820" width="90" height="79"></use>
        <use href="#icon-bridge" x="740" y="1900" width="100" height="60"></use>
        <use href="#icon-boat" x="200" y="2540" width="80" height="70"></use>
        <use href="#icon-buddha" x="740" y="3120" width="80" height="80"></use>
      </g>
      <g class="map__lakes" aria-hidden="true">
        <use href="#icon-lakes" x="210" y="1320" width="90" height="68"></use>
      </g>
      <g class="map__waves" aria-hidden="true">
        <path d="M120 640 q22 -13 44 0 t44 0 t44 0"></path>
        <path d="M690 1180 q22 -13 44 0 t44 0 t44 0"></path>
        <path d="M140 1920 q22 -13 44 0 t44 0 t44 0"></path>
        <path d="M650 2460 q22 -13 44 0 t44 0 t44 0"></path>
        <path d="M180 3180 q22 -13 44 0 t44 0 t44 0"></path>
      </g>
      <g class="map__footprints" id="footprints"></g>
    </svg>

    <div class="map__pins" id="pins"></div>
  </main>

  <p class="map__hint">Листай вниз. Нажми на место — след дойдёт до него и откроются фото</p>

  <div class="map__compass" aria-hidden="true">
    <span class="map__compass-n">С</span>
    <span class="map__compass-w">З</span>
    <i class="map__compass-axis"></i>
    <span class="map__compass-e">В</span>
    <span class="map__compass-s">Ю</span>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__backdrop" id="panelBackdrop"></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <button class="panel__close" id="panelClose" type="button" aria-label="Закрыть галерею">×</button>
      <p class="panel__eyebrow" id="panelCountry"></p>
      <h2 class="panel__title" id="panelTitle"></h2>
      <p class="panel__subtitle" id="panelSubtitle"></p>
      <p class="panel__caption" id="panelCaption"></p>
      <div class="panel__grid" id="panelGrid"></div>
      <p class="panel__hint">Кликни фото, чтобы посмотреть побольше</p>
    </aside>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
    <div class="lightbox__inner">
      <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Предыдущая фотография">‹</button>
      <figure class="lightbox__figure">
        <div class="lightbox__stage" id="lightboxStage"></div>
        <figcaption class="lightbox__caption" id="lightboxCaption"></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Следующая фотография">›</button>
    </div>
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Закрыть просмотр">×</button>
  </div>

  <script src="data/places.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
